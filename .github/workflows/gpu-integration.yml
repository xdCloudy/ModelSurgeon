name: GPU integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    if: ${{ vars.GPU_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --extra hf --locked
      - run: uv run pytest -m gpu

