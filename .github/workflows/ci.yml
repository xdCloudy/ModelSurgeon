name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=modelsurgeon --cov-report=term-missing

  hf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra hf --locked
      - run: >-
          uv run pytest
          tests/test_hf_mlp_proof_integration.py
          tests/test_surgeon_mlp_integration.py
          -q

  lightgbm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv pip install 'lightgbm>=4,<5'
      - run: >-
          uv run pytest
          tests/test_first_surgeon_evidence_lightgbm.py
          tests/test_feature_attribution.py
          -q

  performance-pr-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - name: Run bounded CPU and GGUF regression fixtures
        run: >-
          uv run python tools/run_performance_regressions.py
          --profile pr-cpu
          --output performance-pr-cpu.json
      - name: Upload hardware-bound regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-pr-cpu
          path: performance-pr-cpu.json
          if-no-files-found: warn
